<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>웹앱 관리 · AI-V2G 실증 대시보드</title>
<script>
(function () {
  var t;
  try { t = localStorage.getItem('ai-v2g-theme'); } catch (e) { t = null; }
  document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : 'light');
})();
</script>
<style>
  * { box-sizing: border-box; }
  body.ax-page { margin: 0 !important; padding: 0 !important; background: var(--bg); color: var(--text); }
  h1 { font-size: 20px; margin: 0; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--border); background: var(--card); color: var(--text);
                 border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--navy); color: #fff; font-weight: 700; }
  #panel button { border: 1px solid var(--border); background: var(--card); color: var(--text);
                  border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  #panel button.ok { background: #1F5EDB; border-color: #1F5EDB; color: #fff; }
  #panel button.no { color: #d03b3b; }
  #panel button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; }
  .row { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 180px; }
  .name { font-weight: 600; }
  .muted { font-size: 12.5px; color: var(--muted); }
  label.f { display: block; font-size: 12px; color: var(--text); margin: 10px 0 4px; }
  input[type=text], textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
                               color: var(--text); padding: 8px 10px; font-size: 13px; font-family: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
  .tag.on { color: #10b981; } .tag.off { color: var(--muted); } .tag.bad { color: #d03b3b; }
  .empty { padding: 36px; text-align: center; color: var(--muted); }
  .msg { font-size: 13px; min-height: 20px; margin-bottom: 10px; }
  .msg.err { color: #d03b3b; }
  .body-text { white-space: pre-wrap; font-size: 13.5px; margin: 8px 0 0; }
    /* 핵심 LNB 레이아웃 인라인 보장 (프리미엄 슬라이딩 트랜지션) */
  .ax-layout { display: flex; min-height: 100vh; background: var(--bg); }
  .ax-sidebar {
    width: 230px; min-width: 230px; flex-shrink: 0; background: var(--navy, #14213d); color: #fff;
    position: fixed; left: 0; top: 0; bottom: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: stretch; text-align: left;
    padding: 18px 14px; gap: 18px; box-shadow: 2px 0 12px rgba(0,0,0,0.15); overflow-y: auto; overflow-x: hidden;
    transform: translateX(0); opacity: 1; visibility: visible;
    transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease;
    will-change: transform;
  }
  .ax-sidebar .ax-logo { display: flex; align-items: center; justify-content: flex-start; gap: 8px; color: #fff; text-decoration: none; font-size: 15px; }
  .ax-sidebar .ax-nav { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .ax-sidebar .ax-nav a { display: flex; align-items: center; justify-content: flex-start; text-align: left; padding: 10px 14px; border-radius: 8px; color: #DCE6FA; font-size: 13.5px; font-weight: 500; text-decoration: none; }
  .ax-sidebar .ax-nav [aria-current="page"], .ax-sidebar .ax-nav a.active { background: #1F5EDB !important; color: #fff !important; font-weight: 700; }
  .ax-sidebar-status .ax-pill { width: 100%; justify-content: flex-start; text-align: left; box-sizing: border-box; }
  .ax-content {
    margin-left: 230px; flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg);
    transition: margin-left 0.28s cubic-bezier(0.25, 1, 0.5, 1); will-change: margin-left;
  }
  .ax-topbar { position: sticky; top: 0; z-index: 40; background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ax-main-body { padding: 18px 24px 40px; flex: 1; }
  .ax-layout.sidebar-collapsed .ax-sidebar {
    transform: translateX(-100%); box-shadow: none; opacity: 0; pointer-events: none; visibility: hidden;
    transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.22s ease, visibility 0.28s;
  }
  .ax-layout.sidebar-collapsed .ax-content { margin-left: 0 !important; width: 100% !important; }
  @media (max-width: 768px) {
    .ax-layout { flex-direction: column; }
    .ax-sidebar { position: sticky; top: 0; width: 100%; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: 10px 14px; gap: 8px; z-index: 60; }
    .ax-sidebar .ax-nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
    .ax-sidebar .ax-nav a { padding: 6px 10px; font-size: 12px; }
    .ax-sidebar-status, .ax-sidebar-toggle-btn { display: none !important; }
    .ax-content { margin-left: 0 !important; }
    .ax-topbar { padding: 8px 14px; }
    .ax-main-body { padding: 12px 14px 24px; }
  }
</style>
<link rel="stylesheet" href="/theme.css" />
<script src="/loading.js"></script>
</head>
<body class="ax-page">
<div class="ax-layout">
  <!-- 좌측 LNB 사이드바 -->
    <!-- 좌측 LNB 사이드바 -->
  <aside class="ax-sidebar">
    <div class="ax-sidebar-header">
      <a class="ax-logo" href="/dashboard">
        <span class="ax-logo-badge">AX</span>
        <span><b>AX·V2G</b> <span>허브 실증</span></span>
      </a>
      <button class="ax-sidebar-toggle-btn" id="sidebar-hide-btn" title="좌측 메뉴 숨기기" aria-label="메뉴 숨기기">◀</button>
    </div>
    <nav class="ax-nav" aria-label="화면">
      <a href="/dashboard">운영 대시보드</a>
      <a href="/approvals">가입 승인</a>
      <a href="/admin" aria-current="page">웹앱 관리</a>
      <a href="/docs" target="_blank" rel="noopener">API 안내</a>
    </nav>
    <div class="ax-sidebar-status" style="margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.12);">
      <span class="ax-pill"><span class="ax-dot" style="background:#2fb67c"></span><b>EV 30/30</b></span>
      <span class="ax-pill"><span class="ax-dot accent"></span><b>충전기 150/150</b></span>
      <span class="ax-pill mono">데이터 4,000건+</span>
    </div>
  </aside>

  <!-- 우측 본문 및 상단 탑 바 -->
  <div class="ax-content">
    <header class="ax-topbar">
      <div class="ax-header" style="display:none"></div>
      <div class="ax-topbar-left">
        <button id="sidebar-toggle-btn" class="ax-icon-btn" title="좌측 메뉴 열기/숨기기" aria-label="메뉴 열기/숨기기" style="padding:6px 10px; font-weight:700; gap:5px; font-size:12.5px; display:inline-flex; align-items:center;">
          ☰ <span class="toggle-txt">메뉴</span>
        </button>
      </div>
      <div class="ax-tools" style="margin-left:auto; display:flex; align-items:center; gap:8px;">
        <span id="user-badge" style="font-size:12.5px; font-weight:600; color:var(--text); padding:4px 8px; background:var(--bg); border:1px solid var(--border); border-radius:6px;"></span>
        <a href="/dashboard" style="text-decoration:none; padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:12.5px;">운영 대시보드</a>
        <a href="/docs" target="_blank" rel="noopener" style="text-decoration:none; padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:12.5px;">API 문서</a>
        <button id="logout-btn" type="button" style="padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12.5px; cursor:pointer;">로그아웃</button>
      </div>
    </header>

    <div class="ax-main-body">
  <div class="ax-page-head">
      <h1>웹앱 관리</h1>
      <div class="sub">서포터즈 모바일 앱의 공지사항·안내 문구, ㈜아크릴 예측모델 연계(학습 데이터 제공·예측 결과 수신), AI 운영 지표, 모델링 예외 기록, 참여주체 VoC 설문, 서포터즈 리워드(가상 전력 거래 모의 정산·미션)를 관리합니다.</div>
  </div>
  <div class="tabs" role="group" aria-label="메뉴">
    <button type="button" data-tab="notices" aria-pressed="true">공지사항</button>
    <button type="button" data-tab="acryl" aria-pressed="false">㈜아크릴 연계</button>
    <button type="button" data-tab="content" aria-pressed="false">앱 안내 문구</button>
    <button type="button" data-tab="kpi" aria-pressed="false">AI 운영 지표</button>
    <button type="button" data-tab="issues" aria-pressed="false">예외 기록</button>
    <button type="button" data-tab="surveys" aria-pressed="false">VoC 설문</button>
    <button type="button" data-tab="reward" aria-pressed="false">리워드·정산</button>
  </div>
  <div id="msg" class="msg" role="status"></div>
  <div id="panel"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var panel = document.getElementById('panel'), msgEl = document.getElementById('msg');
  var tab = ['notices', 'acryl', 'content', 'kpi', 'issues', 'surveys', 'reward'].indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : 'notices';
  var busy = false, editing = null;

  async function api(path, opts) {
    var res = await fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opts || {}));
    var body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    return { ok: res.ok, status: res.status, body: body };
  }
  function el(tag, props, children) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function say(t, err) { msgEl.textContent = t || ''; msgEl.className = 'msg' + (err ? ' err' : ''); }
  function detail(r, fb) { var d = r.body && r.body.detail; return (typeof d === 'string' && d) || (Array.isArray(d) && d[0] && d[0].msg) || fb; }
  function fmt(iso) { try { return new Date(iso).toLocaleString('ko-KR', { hour12: false }); } catch (e) { return iso || ''; } }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  async function act(btn, fn, doneText) {
    if (busy) return;
    busy = true; btn.disabled = true; say('');
    try {
      var r = await fn();
      if (!r.ok) { say(detail(r, '처리에 실패했습니다.'), true); return; }
      say(doneText, false);
      await render();
    } catch (e) { say('네트워크 오류입니다.', true); }
    finally { busy = false; btn.disabled = false; }
  }
  function send(method, path, body) { return api(path, { method: method, body: body ? JSON.stringify(body) : undefined }); }

  // ---------------------------------------------------------------- 공지사항
  async function renderNotices() {
    var r = await api('/admin/notices');
    if (!r.ok) { say(detail(r, '불러오지 못했습니다.'), true); return; }
    var title = el('input', { type: 'text', id: 'nt', maxlength: '80', placeholder: '제목(80자 이하)' });
    var body = el('textarea', { id: 'nb', maxlength: '2000', placeholder: '내용(2,000자 이하)' });
    var tEn = el('input', { type: 'text', id: 'nte', maxlength: '80', placeholder: 'English title (optional)' });
    var bEn = el('textarea', { id: 'nbe', maxlength: '2000', placeholder: 'English body (optional — title and body together)' });
    var pinned = el('input', { type: 'checkbox', id: 'np' }), pub = el('input', { type: 'checkbox', id: 'nu' });
    pub.checked = true;
    if (editing) { title.value = editing.title; body.value = editing.body; tEn.value = editing.title_en || ''; bEn.value = editing.body_en || ''; pinned.checked = editing.pinned; pub.checked = editing.published; }
    var save = el('button', { type: 'button', class: 'ok', text: editing ? '수정 저장' : '공지 등록' });
    save.addEventListener('click', function () {
      var payload = { title: title.value, body: body.value, title_en: tEn.value, body_en: bEn.value, pinned: pinned.checked, published: pub.checked };
      var wasEditing = editing;
      act(save, async function () {
        var res = await (wasEditing ? send('PUT', '/admin/notices/' + wasEditing.id, payload) : send('POST', '/admin/notices', payload));
        if (res.ok) editing = null;   // 성공했을 때만 편집 상태를 끝낸다(실패하면 입력을 유지)
        return res;
      }, wasEditing ? '공지를 수정했습니다.' : '공지를 등록했습니다.');
    });
    var cancel = el('button', { type: 'button', text: '취소' });
    cancel.addEventListener('click', function () { editing = null; render(); });
    panel.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'name', text: editing ? '공지 수정' : '새 공지' }),
      el('label', { class: 'f', for: 'nt', text: '제목' }), title,
      el('label', { class: 'f', for: 'nb', text: '내용' }), body,
      el('label', { class: 'f', for: 'nte', text: '영어 제목·내용(선택) — 영어 앱에서 보입니다' }), tEn, bEn,
      el('div', { class: 'row', style: 'margin-top:10px' }, [
        el('label', { class: 'muted' }, [pinned, document.createTextNode(' 맨 위에 고정')]),
        el('label', { class: 'muted' }, [pub, document.createTextNode(' 앱에 공개')]),
        el('span', { class: 'grow' }), editing ? cancel : el('span', {}), save]),
    ]));
    if (!r.body.notices.length) { panel.appendChild(el('div', { class: 'empty', text: '등록된 공지가 없습니다.' })); return; }
    r.body.notices.forEach(function (n) {
      var edit = el('button', { type: 'button', text: '수정' });
      edit.addEventListener('click', function () { editing = n; render(); window.scrollTo(0, 0); });
      var toggle = el('button', { type: 'button', text: n.published ? '비공개로' : '공개로' });
      toggle.addEventListener('click', function () { act(toggle, function () { return send('PUT', '/admin/notices/' + n.id, { title: n.title, body: n.body, title_en: n.title_en, body_en: n.body_en, pinned: n.pinned, published: !n.published }); }, '변경했습니다.'); });
      var del = el('button', { type: 'button', class: 'no', text: '삭제' });
      del.addEventListener('click', function () {
        if (del.dataset.arm !== '1') { del.dataset.arm = '1'; del.textContent = '한 번 더 누르면 삭제'; return; }
        act(del, function () { return send('DELETE', '/admin/notices/' + n.id); }, '삭제했습니다.');
      });
      panel.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'row' }, [
          el('span', { class: 'name grow', text: n.title }),
          n.title_en ? el('span', { class: 'tag off', text: 'EN' }) : el('span', {}),
          n.pinned ? el('span', { class: 'tag on', text: '고정' }) : el('span', {}),
          el('span', { class: 'tag ' + (n.published ? 'on' : 'off'), text: n.published ? '공개' : '비공개' }),
          el('span', { class: 'muted', text: fmt(n.updated_at) + ' · ' + (n.created_by || '') })]),
        el('div', { class: 'body-text', text: n.body }),
        el('div', { class: 'row', style: 'margin-top:10px' }, [edit, toggle, del]),
      ]));
    });
  }

  // ---------------------------------------------------------------- ㈜아크릴 연계(계획서 5.2 기관 간 인터페이스)
  // 제공 묶음 파기 확인(계획서 6장: 참여기관은 사업 목적 범위 내 이용 후 파기) — 기록하면 더 내려받을 수 없다
  function destructionRow(x) {
    if (x.destroyed_at) {
      return el('div', { class: 'row', style: 'margin-top:8px' }, [el('span', { class: 'tag', text: '파기 확인' }),
        el('span', { class: 'muted', text: fmt(x.destroyed_at) + ' · ' + (x.destroyed_by || '') + ' · ' + (x.destruction_note || '') })]);
    }
    var note = el('input', { type: 'text', maxlength: '300', placeholder: '파기 근거(예: 2027-11-30 아크릴 파기 확인서 수령)', 'aria-label': '파기 근거' });
    note.style.flex = '1';
    var btn = el('button', { type: 'button', text: '파기 확인 기록' });
    btn.addEventListener('click', function () {
      act(btn, function () { return send('POST', '/acryl/exports/' + encodeURIComponent(x.export_id) + '/destruction', { note: note.value.trim() }); },
        '파기 확인을 기록했습니다. 이 묶음은 더 내려받을 수 없습니다.');
    });
    return el('div', { class: 'row', style: 'margin-top:8px; gap:8px' }, [el('span', { class: 'tag off', text: '이용 중' }), note, btn]);
  }

  async function renderAcryl() {
    var rs = await Promise.all([api('/acryl/exports'), api('/acryl/forecasts/status')]);
    if (!rs[0].ok || !rs[1].ok) { say(detail(rs[0].ok ? rs[1] : rs[0], '불러오지 못했습니다.'), true); return; }
    var from = el('input', { type: 'date', 'aria-label': '제공 기간 시작일' }), to = el('input', { type: 'date', 'aria-label': '제공 기간 종료일' });
    var make = el('button', { type: 'button', class: 'ok', text: '제공 묶음 만들기' });
    make.addEventListener('click', function () {
      act(make, function () { return send('POST', '/acryl/exports', { period_start: from.value || null, period_end: to.value || null }); },
        '학습용 정제 데이터 묶음을 만들었습니다(가명처리·SHA-256 기록).');
    });
    panel.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'name', text: '학습용 정제 데이터 제공(아우토크립트 → 아크릴)' }),
      el('div', { class: 'muted', text: '차량 ID는 가명으로 바꾸고 식별정보는 싣지 않습니다. 외부 제공 동의를 철회한 차량은 뺍니다. 1차 학습용 데이터는 2027년 1월 초 누적분 제공이 목표입니다.' }),
      el('div', { class: 'row', style: 'margin-top:10px' }, [el('span', { class: 'muted', text: '기간(비우면 전체)' }), from, el('span', { class: 'muted', text: '~' }), to, el('span', { class: 'grow' }), make])]));
    var ex = rs[0].body.exports;
    if (!ex.length) panel.appendChild(el('div', { class: 'empty', text: '아직 제공한 묶음이 없습니다.' }));
    ex.forEach(function (x) {
      var rows = Object.keys(x.row_counts).map(function (k) { return k + ' ' + Number(x.row_counts[k]).toLocaleString('ko-KR'); }).join(' · ');
      panel.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'row' }, [el('span', { class: 'name grow', text: x.export_id }),
          el('span', { class: 'muted', text: fmt(x.created_at) + ' · ' + (x.created_by || '') })]),
        el('div', { class: 'muted', text: '기간 ' + (x.period_start || '처음') + ' ~ ' + (x.period_end || '끝') + ' · ' + rows }),
        el('div', { class: 'muted', text: 'SHA-256 ' + x.sha256 }),
        destructionRow(x)]));
    });
    panel.appendChild(el('div', { class: 'card', style: 'margin-top:18px' }, [
      el('div', { class: 'name', text: '예측 추론 결과 수신(아크릴 → 아우토크립트, 일 배치)' }),
      el('div', { class: 'muted', text: '참여기관은 연계 토큰(ACRYL_API_TOKEN)과 허용 접속지(ACRYL_ALLOWED_IPS)로 /partner/acryl/forecasts 에 보냅니다. 수신값은 추론값으로 따로 보관하며, 예측이 있으면 충전 추천·전망에 우선 사용합니다.' })]));
    rs[1].body.targets.forEach(function (t) {

      stat('처리 대기 문의', sm.open_inquiries + '건', '참여자 정산 문의')]));

    // ④ 정산 회차
    var pf = el('input', { type: 'date', 'aria-label': '정산 시작일' }), pt = el('input', { type: 'date', 'aria-label': '정산 종료일' });
    var mk = el('button', { type: 'button', class: 'ok', text: '정산 산정' });
    mk.addEventListener('click', function () {
      act(mk, function () { return send('POST', '/vpp/settlement/runs', { period_from: pf.value || null, period_to: pt.value || null }); },
        '정산을 산정했습니다. 내용을 검토한 뒤 확정하세요.');
    });
    var rc = el('div', { class: 'card' }, [el('div', { class: 'name', text: '정산 회차' }),
      el('div', { class: 'muted', text: '기간을 비우면 실적 전체 기간을 산정합니다. 이미 다른 회차에 들어간 차량·일은 건너뜁니다. 산정 상태에서는 잔액에 반영되지 않습니다.' }),
      el('div', { class: 'row', style: 'gap:8px; margin:8px 0' }, [pf, el('span', { text: '~' }), pt, mk])]);
    if (!runs.length) rc.appendChild(el('div', { class: 'muted', text: '아직 정산 회차가 없습니다.' }));
    for (var i = 0; i < runs.length; i++) {
      (function (r) {
        var tt = r.totals || {}, ec = tt.economics || {};
        var line = el('div', { class: 'row', style: 'gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--border)' }, [
          el('span', { class: r.status === 'confirmed' ? 'tag on' : 'tag', text: r.status_label }),
          el('span', { class: 'name', text: '회차 ' + r.run_id + ' · ' + r.period_from + ' ~ ' + r.period_to }),
          el('span', { class: 'muted', text: (tt.trades || 0) + '건 · ' + pts(tt.points) + ' · 지급률 ' + (ec.payout_ratio_pct == null ? '-' : ec.payout_ratio_pct + '%') +
            (r.decided_by ? ' · ' + r.decided_by + (r.note ? '(' + r.note + ')' : '') : '') })]);
        var view = el('button', { type: 'button', text: runOpen === r.run_id ? '상세 닫기' : '상세' });
        view.addEventListener('click', function () { runOpen = runOpen === r.run_id ? null : r.run_id; render(); });
        line.appendChild(view);
        if (r.status === 'draft') {
          var ok = el('button', { type: 'button', class: 'ok', text: '확정' });
          ok.addEventListener('click', function () { act(ok, function () { return send('POST', '/vpp/settlement/runs/' + r.run_id + '/confirm', { note: '' }); }, '확정했습니다. 참여자 잔액에 반영됐습니다.'); });
          var reason = el('input', { type: 'text', maxlength: '200', placeholder: '취소 사유', 'aria-label': '취소 사유' });
          var no = el('button', { type: 'button', class: 'no', text: '취소' });
          no.addEventListener('click', function () { act(no, function () { return send('POST', '/vpp/settlement/runs/' + r.run_id + '/cancel', { note: reason.value }); }, '산정을 취소했습니다.'); });
          line.appendChild(ok); line.appendChild(reason); line.appendChild(no);
        }
        rc.appendChild(line);
        if (runOpen === r.run_id) {
          var holder = el('div', { class: 'muted', text: '불러오는 중…' });
          rc.appendChild(holder);
          api('/vpp/settlement/runs/' + r.run_id).then(function (d) {
            clear(holder);
            if (!d.ok) { holder.textContent = detail(d, '불러오지 못했습니다.'); return; }
            holder.appendChild(table(['차량', '날짜', '소속', '피크 방전 kWh', '흡수 kWh', '요금 차익', '피크 저감', '출력제어 완화', '포인트', '동의'],
              d.body.trades.slice(0, 200).map(function (x) { return [x.ev_id, x.trade_date, x.affiliation === 'public' ? '관용' : '민간', x.peak_discharge_kwh, x.absorb_kwh,
                won(x.tou_krw), won(x.peak_krw), won(x.curtail_krw), pts(x.points), x.consent_note]; })));
          });
        }
      })(runs[i]);
    }
    panel.appendChild(rc);

    // ⑥ 경제성 검증·인센티브 비교(미리보기, 원장 미반영)
    var inc = pv.incentives || { options: [] };
    panel.appendChild(el('div', { class: 'card' }, [el('div', { class: 'name', text: '경제성 검증 · 인센티브 유형 비교 (미리보기)' }),
      el('div', { class: 'muted', text: '재원 ' + won(pv.economics.benefit_krw) + ' = 요금 차익 ' + won(pv.economics.benefit_by_source_krw['요금 차익']) +
        ' + 피크 저감 ' + won(pv.economics.benefit_by_source_krw['피크 저감']) + ' + 출력제어 완화 ' + won(pv.economics.benefit_by_source_krw['출력제어 완화']) +
        ' · 참여자 배분율 ' + pv.rules.owner_share_pct + '% · ' + pv.label }),
      table(['인센티브 유형', '참여자 몫', '차량당', '재원 대비'], inc.options.map(function (o) { return [o.label, won(o.participant_krw), won(o.per_vehicle_krw), o.benefit_ratio_pct == null ? '-' : o.benefit_ratio_pct + '%']; })),
      el('div', { class: 'muted', style: 'margin-top:6px', text: inc.note || '' })]));

    // ⑤ 문의·조정
    var qc = el('div', { class: 'card' }, [el('div', { class: 'name', text: '참여자 정산 문의 (처리 대기 ' + inq.length + '건)' })]);
    inq.forEach(function (q) {
      var ans = el('input', { type: 'text', maxlength: '500', placeholder: '답변', 'aria-label': '답변' }); ans.style.flex = '2';
      var adj = el('input', { type: 'number', value: '0', step: '10', 'aria-label': '조정 포인트', style: 'width:90px' });
      var go = el('button', { type: 'button', class: 'ok', text: '답변' });
      go.addEventListener('click', function () { act(go, function () { return send('POST', '/vpp/settlement/inquiries/' + q.inquiry_id + '/resolve', { answer: ans.value, adjust_points: Number(adj.value) || 0 }); }, '답변했습니다.'); });
      qc.appendChild(el('div', { style: 'padding:8px 0; border-top:1px solid var(--border)' }, [
        el('div', { text: q.ev_id + (q.trade_date ? ' · ' + q.trade_date : '') + ' · ' + fmt(q.created_at) }), el('div', { class: 'muted', text: q.message }),
        el('div', { class: 'row', style: 'gap:6px; margin-top:6px' }, [ans, adj, el('span', { class: 'muted', text: 'P 조정' }), go])]));
    });
    var aev = el('input', { type: 'text', maxlength: '40', placeholder: '차량 ID', 'aria-label': '차량 ID' });
    var apt = el('input', { type: 'number', step: '10', placeholder: '±포인트', 'aria-label': '조정 포인트', style: 'width:110px' });
    var arsn = el('input', { type: 'text', maxlength: '200', placeholder: '조정 사유(필수)', 'aria-label': '조정 사유' }); arsn.style.flex = '2';
    var abtn = el('button', { type: 'button', text: '포인트 조정' });
    abtn.addEventListener('click', function () { act(abtn, function () { return send('POST', '/vpp/settlement/adjust', { ev_id: aev.value.trim(), points: Number(apt.value) || 0, reason: arsn.value }); }, '조정했습니다.'); });
    qc.appendChild(el('div', { class: 'row', style: 'gap:6px; margin-top:10px; padding-top:8px; border-top:1px solid var(--border)' }, [aev, apt, arsn, abtn]));
    panel.appendChild(qc);

    // 미션 관리
    var mcard = el('div', { class: 'card' }, [el('div', { class: 'name', text: '미션 관리 (가상 리워드)' }),
      el('div', { class: 'muted', text: ms.note + ' 등급: ' + ms.levels.map(function (l) { return l.name + ' ' + pts(l.from_points) + '~'; }).join(' · ') })]);
    ms.missions.forEach(function (x) {
      var en = el('input', { type: 'checkbox', 'aria-label': x.title + ' 사용' }); en.checked = x.enabled;
      var pp = el('input', { type: 'number', min: '0', max: '100000', step: '10', value: String(x.points), 'aria-label': x.title + ' 보상', style: 'width:90px' });
      var sv = el('button', { type: 'button', text: '저장' });
      sv.addEventListener('click', function () { act(sv, function () { return send('PUT', '/vpp/missions/' + x.id, { enabled: en.checked, points: Number(pp.value) || 0 }); }, '미션 설정을 저장했습니다.'); });
      mcard.appendChild(el('div', { class: 'row', style: 'gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--border)' }, [
        en, el('div', { style: 'flex:1; min-width:200px' }, [el('div', { class: 'name', text: x.title + ' · ' + x.period_label + ' · 목표 ' + x.target + x.unit }),
          el('div', { class: 'muted', text: x.description + ' — 완료 ' + x.completions + '건(' + x.vehicles + '대), 지급 ' + pts(x.points_paid != null ? x.points_paid : 0) })]),
        pp, el('span', { class: 'muted', text: 'P' }), sv]));
    });
    if (ms.recent.length) mcard.appendChild(el('div', { style: 'margin-top:8px' }, [el('div', { class: 'muted', text: '최근 보상' }),
      table(['차량', '미션', '기간', '포인트', '시각'], ms.recent.slice(0, 10).map(function (r) { return [r.ev_id, r.mission_id, r.period_key, pts(r.points), fmt(r.completed_at)]; }))]));
    panel.appendChild(mcard);
  }

  async function render() {
    clear(panel);
    if (tab === 'notices') await renderNotices();
    else if (tab === 'acryl') await renderAcryl();
    else if (tab === 'kpi') await renderKpi();
    else if (tab === 'issues') await renderIssues();
    else if (tab === 'surveys') await renderSurveys();
    else if (tab === 'reward') await renderReward();
    else await renderContent();
  }
  document.querySelector('.tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.getAttribute('data-tab'); editing = null; say('');
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    render();
  });
  (async function boot() {
    var me;
    try { me = await api('/auth/me'); } catch (e) { me = null; }
    if (!me || !me.ok) { location.href = '/login?next=/admin'; return; }
    if (me.body.role === 'owner') { location.href = '/login?next=/admin&reason=owner'; return; }
    var roleLabel = me.body.role === 'super_admin' ? '최고관리자' : '관리자';
    var ub = document.getElementById('user-badge');
    if (ub) ub.textContent = me.body.username + ' (' + roleLabel + ')';
    var lo = document.getElementById('logout-btn');
    if (lo) lo.addEventListener('click', async function () { await api('/auth/logout', { method: 'POST' }); location.href = '/login'; });
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-tab') === tab)); });
    render();
  })();
})();
// 사이드바 숨김/열기 토글 (디폴트 열림, localStorage 상태 보존)
(function initSidebarToggle() {
  const layout = document.querySelector('.ax-layout');
  const hideBtn = document.getElementById('sidebar-hide-btn');
  const toggleBtn = document.getElementById('sidebar-toggle-btn');
  if (!layout) return;

  function updateToggleUI(collapsed) {
    if (toggleBtn) {
      const txt = toggleBtn.querySelector('.toggle-txt');
      if (txt) txt.textContent = collapsed ? '메뉴 열기' : '메뉴';
      toggleBtn.title = collapsed ? '좌측 메뉴 열기' : '좌측 메뉴 숨기기';
    }
  }

  // 디폴트는 열림(false), localStorage에 'true'로 저장된 경우만 숨김 처리
  const isCollapsed = localStorage.getItem('ai-v2g-sidebar-collapsed') === 'true';
  if (isCollapsed) {
    layout.classList.add('sidebar-collapsed');
  }
  updateToggleUI(isCollapsed);

  function toggle() {
    const collapsed = layout.classList.toggle('sidebar-collapsed');
    try {
      localStorage.setItem('ai-v2g-sidebar-collapsed', collapsed ? 'true' : 'false');
    } catch (e) {}
    updateToggleUI(collapsed);
  }

  if (hideBtn) hideBtn.addEventListener('click', toggle);
  if (toggleBtn) toggleBtn.addEventListener('click', toggle);
})();

</script>
</body>
</html>
