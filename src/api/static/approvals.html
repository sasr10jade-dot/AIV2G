<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>가입 승인 · AI-V2G 실증 대시보드</title>
<script>
(function () {
  var t;
  try { t = localStorage.getItem('ai-v2g-theme'); } catch (e) { t = null; }
  document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : 'light');
})();
</script>
<style>
  * { box-sizing: border-box; }
  body.ax-page { margin: 0 !important; padding: 0 !important; background: var(--bg); color: var(--text); }
  h1 { font-size: 20px; margin: 0; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { border: 1px solid var(--border); background: var(--card); color: var(--text);
                 border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--navy); color: #fff; font-weight: 700; }
  #list button { border: 1px solid var(--border); background: var(--card); color: var(--text);
                 border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  #list button.ok { background: #1F5EDB; border-color: #1F5EDB; color: #fff; }
  #list button.no { color: #d03b3b; }
  #list button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 10px;
          display: grid; grid-template-columns: 1.1fr 1.6fr 1.3fr auto; gap: 8px 18px; align-items: center; }
  .name { font-weight: 600; }
  .muted { font-size: 12.5px; color: var(--muted); }
  .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text);
          padding: 7px 10px; font-size: 13px; width: 150px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
  .tag.approved { color: #10b981; } .tag.rejected { color: #d03b3b; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .msg { font-size: 13px; min-height: 20px; margin-bottom: 10px; }
  .msg.err { color: #d03b3b; }
  @media (max-width: 800px) { .card { grid-template-columns: 1fr; } .acts { justify-content: flex-start; } }
</style>
<link rel="stylesheet" href="/theme.css" />
</head>
<body class="ax-page">
<div class="ax-layout">
  <!-- 좌측 LNB 사이드바 -->
    <!-- 좌측 LNB 사이드바 -->
  <aside class="ax-sidebar">
    <a class="ax-logo" href="/dashboard">
      <span class="ax-logo-badge">AX</span>
      <span><b>AX·V2G</b> <span>허브 실증</span></span>
    </a>
    <nav class="ax-nav" aria-label="화면">
      <a href="/dashboard">운영 대시보드</a>
      <a href="/approvals" aria-current="page">가입 승인</a>
      <a href="/admin">웹앱 관리</a>
      <a href="/docs" target="_blank" rel="noopener">API 안내</a>
    </nav>
    <div class="ax-sidebar-status" style="margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.12);">
      <span class="ax-pill"><span class="ax-dot" style="background:#2fb67c"></span><b>EV 30/30</b></span>
      <span class="ax-pill"><span class="ax-dot accent"></span><b>충전기 150/150</b></span>
      <span class="ax-pill mono">데이터 4,000건+</span>
      <span class="badge good" style="font-size:11px; text-align:center;">실증 인프라 가동</span>
    </div>
  </aside>

  <!-- 우측 본문 및 상단 탑 바 -->
  <div class="ax-content">
    <header class="ax-topbar">
      <div class="ax-header" style="display:none"></div>
      <div class="ax-tools" style="margin-left:auto; display:flex; align-items:center; gap:8px;">
        <span id="user-badge" style="font-size:12.5px; font-weight:600; color:var(--text); padding:4px 8px; background:var(--bg); border:1px solid var(--border); border-radius:6px;"></span>
        <a href="/dashboard" style="text-decoration:none; padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:12.5px;">운영 대시보드</a>
        <a href="/docs" target="_blank" rel="noopener" style="text-decoration:none; padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:12.5px;">API 문서</a>
        <button id="logout-btn" type="button" style="padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12.5px; cursor:pointer;">로그아웃</button>
      </div>
    </header>

    <div class="ax-main-body">
  <div class="ax-page-head">
      <h1>모바일 가입 승인</h1>
      <div class="sub">승인하면 가입자 계정에 차량이 연결되어 모바일에서 충전 안내가 열립니다. 30대가 찼거나 차종 구성상 보류할 신청은 '예비'로 두고, 활동 차량이 빠지면 예비에서 승인해 대체합니다. 번호판은 가려서 보입니다.</div>
  </div>
  <div class="tabs" role="group" aria-label="상태">
    <button type="button" data-status="pending" aria-pressed="true">승인 대기 <span id="pendingCount"></span></button>
    <button type="button" data-status="reserve" aria-pressed="false">예비 참여자 <span id="reserveCount"></span></button>
    <button type="button" data-status="" aria-pressed="false">전체</button>
  </div>
  <div id="msg" class="msg" role="status"></div>
  <div id="list"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var listEl = document.getElementById('list');
  var msgEl = document.getElementById('msg');
  var status = 'pending';
  var busy = false;

  async function api(path, opts) {
    var res = await fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opts || {}));
    var body = null;
    try { body = await res.json(); } catch (e) { body = null; }
    return { ok: res.ok, status: res.status, body: body };
  }
  function el(tag, props, children) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function say(text, isErr) { msgEl.textContent = text || ''; msgEl.className = 'msg' + (isErr ? ' err' : ''); }
  function detail(r, fallback) {
    var d = r.body && r.body.detail;
    return (typeof d === 'string' && d) || (Array.isArray(d) && d[0] && d[0].msg) || fallback;
  }
  function fmt(iso) { try { return new Date(iso).toLocaleString('ko-KR', { hour12: false }); } catch (e) { return iso || ''; } }

  function row(r) {
    var tag = r.status === 'pending' ? null : el('span', { class: 'tag ' + r.status, text: r.status === 'approved' ? '승인됨 · ' + (r.ev_id || '') : '반려됨' });
    var acts = el('div', { class: 'acts' });
    if (r.status === 'pending') {
      var ev = el('input', { type: 'text', placeholder: '차량 ID(비우면 자동)', 'aria-label': '연결할 차량 ID', maxlength: '40' });
      var approve = el('button', { type: 'button', class: 'ok', text: '승인' });
      var reason = el('input', { type: 'text', placeholder: '반려 사유', 'aria-label': '반려 사유', maxlength: '200' });
      var reject = el('button', { type: 'button', class: 'no', text: '반려' });
      approve.addEventListener('click', function () { act(approve, '/registrations/' + encodeURIComponent(r.registration_id) + '/approve',
        { ev_id: ev.value.trim() || null }, r.username + ' 승인 완료'); });
      reject.addEventListener('click', function () {
        if (reason.value.trim().length < 2) { say('반려 사유를 2자 이상 입력하세요.', true); reason.focus(); return; }
        act(reject, '/registrations/' + encodeURIComponent(r.registration_id) + '/reject', { reason: reason.value.trim() }, r.username + ' 반려 완료');
      });
      var resv = el('button', { type: 'button', text: r.reserve ? '대기로 돌리기' : '예비로 두기' });
      resv.addEventListener('click', function () {
        act(resv, '/registrations/' + encodeURIComponent(r.registration_id) + '/reserve', { on: !r.reserve, note: reason.value.trim() },
          r.username + (r.reserve ? ' 일반 대기로 돌림' : ' 예비 참여자로 둠'));
      });
      acts.appendChild(ev); acts.appendChild(approve); acts.appendChild(reason); acts.appendChild(reject); acts.appendChild(resv);
    } else {
      acts.appendChild(tag);
      if (r.reject_reason) acts.appendChild(el('span', { class: 'muted', text: r.reject_reason }));
    }
    return el('div', { class: 'card' }, [
      el('div', {}, [el('div', { class: 'name', text: r.username }), el('div', { class: 'muted', text: fmt(r.created_at) })]),
      el('div', {}, [el('div', { text: (r.vehicle_label || r.vehicle_model) + ' · ' + r.plate }),
                     el('div', { class: 'muted', text: (r.occupation_label || '') + ' · ' + (r.region || '') })]),
      el('div', { class: 'muted', text: r.status === 'pending' ? (r.reserve ? '예비 참여자 · ' + fmt(r.reserved_at) + (r.reserve_note ? ' · ' + r.reserve_note : '') : '승인 대기')
        : (r.reviewed_by ? '처리 ' + r.reviewed_by + ' · ' + fmt(r.reviewed_at) : '') }),
      acts,
    ]);
  }

  async function act(btn, path, payload, doneText) {
    if (busy) return;
    busy = true; btn.disabled = true; say('');
    try {
      var r = await api(path, { method: 'POST', body: JSON.stringify(payload) });
      if (!r.ok) { say(detail(r, '처리에 실패했습니다.'), true); return; }
      say(doneText, false);
      await load(true);
    } catch (e) { say('네트워크 오류입니다.', true); }
    finally { busy = false; btn.disabled = false; }
  }

  async function load(keepMsg) {
    if (!keepMsg) say('');
    var r;
    try { r = await api('/registrations' + (status ? '?status=' + status : '')); } catch (e) { say('네트워크 오류입니다.', true); return; }
    if (r.status === 401 || r.status === 403) { location.href = '/login?next=/approvals'; return; }
    if (!r.ok) { say(detail(r, '목록을 불러오지 못했습니다.'), true); return; }
    document.getElementById('pendingCount').textContent = r.body.pending_count ? '(' + r.body.pending_count + ')' : '';
    document.getElementById('reserveCount').textContent = r.body.reserve_count ? '(' + r.body.reserve_count + ')' : '';
    while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
    if (!r.body.registrations.length) listEl.appendChild(el('div', { class: 'empty', text: status === 'reserve' ? '예비 참여자가 없습니다.' : status ? '승인 대기 중인 신청이 없습니다.' : '신청 내역이 없습니다.' }));
    r.body.registrations.forEach(function (x) { listEl.appendChild(row(x)); });
  }

  document.querySelector('.tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-status]');
    if (!b) return;
    status = b.getAttribute('data-status');
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    load();
  });

  (async function boot() {
    var me;
    try { me = await api('/auth/me'); } catch (e) { me = null; }
    if (!me || !me.ok) { location.href = '/login?next=/approvals'; return; }
    if (me.body.role === 'owner') { location.href = '/login?next=/approvals&reason=owner'; return; }
    var roleLabel = me.body.role === 'super_admin' ? '최고관리자' : '관리자';
    var ub = document.getElementById('user-badge');
    if (ub) ub.textContent = me.body.username + ' (' + roleLabel + ')';
    var lo = document.getElementById('logout-btn');
    if (lo) lo.addEventListener('click', async function () { await api('/auth/logout', { method: 'POST' }); location.href = '/login'; });
    load();
    setInterval(function () { if (!busy && document.visibilityState === 'visible' && !document.activeElement.matches('input')) load(true); }, 10000);
  })();
})();
</script>
</body>
</html>
