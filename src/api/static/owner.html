<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI-V2G</title>
<meta name="theme-color" content="#f5f4f0" />
<meta name="description" content="내 전기차의 충전 요금 시간대, 수요예측, 충·방전 추천을 알림으로 받아보세요." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png" />
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="AI-V2G" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script>
(function () {
  var t, l;
  try { t = localStorage.getItem('ai-v2g-theme'); l = localStorage.getItem('ai-v2g-lang'); } catch (e) { t = null; l = null; }
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  document.documentElement.setAttribute('lang', l === 'en' ? 'en' : 'ko');   // 기본 한국어
})();
</script>
<style>
/* 유럽(북유럽·스위스) 스타일: 따뜻한 오프화이트, 헤어라인, 넓은 여백, 하나의 절제된 포인트 색, 평평한 면 */
:root {
  --bg: #f5f4f0; --surface: #ffffff; --surface-2: #ecebe5; --border: #dddbd3;
  --text: #17191c; --muted: #6c6f73; --accent: #1d4ed8; --accent-ink: #ffffff;
  --charge: #1f6f5c; --warn: #b4651d; --bad: #b3261e;
  --r: 4px;
}
:root[data-theme="dark"] {
  --bg: #0f1113; --surface: #16191c; --surface-2: #1f2327; --border: #2c3136;
  --text: #ecebe7; --muted: #8f9399; --accent: #8fb0ff; --accent-ink: #0b1220;
  --charge: #6fc9ad; --warn: #e0a15c; --bad: #f08a82;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 "Inter", "Helvetica Neue", Helvetica, "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
  -webkit-text-size-adjust: 100%; overscroll-behavior-y: contain; -webkit-font-smoothing: antialiased;
  word-break: keep-all; /* 한글을 어절 단위로 줄바꿈 */
}
button, input, select { font: inherit; color: inherit; }
.app { min-height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); }
.brand { font-weight: 600; letter-spacing: .16em; font-size: 13px; text-transform: uppercase; }
.brand span { color: var(--accent); }
.tools { display: flex; align-items: center; gap: 4px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.seg button { min-height: 32px; min-width: 38px; padding: 0 8px; border: 0; background: transparent; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.iconbtn { min-width: 44px; min-height: 44px; border: 0; background: transparent; cursor: pointer; padding: 0 8px; color: var(--muted); font-size: 13px; letter-spacing: .04em; }
.iconbtn:hover { color: var(--text); }
.iconbtn svg { width: 18px; height: 18px; vertical-align: middle; }
.iconbtn:focus-visible, .tab:focus-visible, .primary:focus-visible, input:focus-visible, select:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; padding: 28px 20px 24px; width: 100%; max-width: 560px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 14px; }
.card h2, .eyebrow { margin: 0 0 8px; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.big { font-size: 22px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; }
.muted { color: var(--muted); font-size: 14px; }
.chip { display: inline-block; padding: 1px 8px; border: 1px solid var(--border); border-radius: 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.banner { margin: 0 20px; padding: 10px 14px; border-radius: var(--r); font-size: 14px; }
.banner.offline { border: 1px solid var(--warn); color: var(--warn); margin-top: 12px; }
.banner.install { border: 1px solid var(--border); margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
input[type=text], input[type=password], input[type=number], select {
  width: 100%; min-height: 48px; padding: 0 12px; border-radius: var(--r);
  border: 1px solid var(--border); background: var(--surface); font-size: 16px;
}
.primary {
  width: 100%; min-height: 48px; margin-top: 22px; border: 0; border-radius: var(--r); cursor: pointer;
  background: var(--text); color: var(--bg); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; font-size: 13px;
}
.linkbtn { display: block; width: 100%; margin-top: 14px; min-height: 44px; background: none; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; cursor: pointer; }
.hint { font-size: 12px; margin: 6px 0 0; }
.consent-text { font-size: 12px; margin: 18px 0 8px; line-height: 1.5; }
label.check { display: flex; align-items: center; gap: 10px; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--text); font-weight: 500; margin: 10px 0 0; }
label.check input { width: 22px; height: 22px; flex: none; }
.primary:disabled { opacity: .5; cursor: default; }
.devlogin {
  width: 100%; min-height: 44px; margin-top: 12px; cursor: pointer; border-radius: var(--r);
  background: transparent; border: 1px dashed var(--warn); color: var(--warn); font-weight: 500; font-size: 13px;
}
.devlogin:disabled { opacity: .5; cursor: default; }
.devlogin:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
.gap { margin-top: 16px !important; }
.error { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 10px; }
.tabs {
  position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--bg); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom);
}
.tab { min-height: 58px; background: none; border: 0; border-top: 2px solid transparent; margin-top: -1px; cursor: pointer; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; position: relative; }
.tab[aria-selected="true"] { color: var(--text); border-top-color: var(--text); font-weight: 600; }
.sm:disabled { opacity: .4; cursor: default; }
.kv { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; }
.kv span:first-child { color: var(--muted); flex: none; }
.kv span:last-child { text-align: right; word-break: break-all; }
.danger { border-color: var(--bad); color: var(--bad); }
.okmsg { color: var(--charge); font-size: 14px; min-height: 20px; margin-top: 10px; }
.hist { padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; margin: 10px 0 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.done i { background: var(--charge); }
.notice { padding: 14px 18px; }
.notice .nt { font-weight: 600; font-size: 15px; }
.notice .nb { white-space: pre-wrap; font-size: 14px; margin-top: 6px; color: var(--muted); }
.notice .pin { font-size: 11px; color: var(--accent); margin-right: 6px; }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 16px; letter-spacing: .04em; word-break: break-all; }
.intro { padding: 0; }
.intro summary { cursor: pointer; list-style: none; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
.intro summary::-webkit-details-marker { display: none; }
.intro summary::after { content: '+'; color: var(--muted); font-size: 18px; }
.intro[open] summary::after { content: '–'; }
.intro .body { padding: 0 20px 18px; }
.intro ol { list-style: none; margin: 12px 0; padding: 0; counter-reset: st; }
.intro li { counter-increment: st; padding: 10px 0 10px 34px; position: relative; border-top: 1px solid var(--border); }
.intro li::before { content: counter(st); position: absolute; left: 0; top: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px; display: flex; align-items: center; justify-content: center; }
.intro li b { display: block; font-weight: 600; font-size: 14px; }
.mission .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.mission .pts { font-size: 13px; color: var(--muted); white-space: nowrap; }
.mission .pts.got { color: var(--charge); }
.tab svg { display: block; width: 22px; height: 22px; margin: 0 auto 3px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.empty { text-align: center; padding: 40px 8px; color: var(--muted); }
.empty svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.2; margin-bottom: 10px; }
.badge {
  position: absolute; top: 8px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; line-height: 16px; letter-spacing: 0;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sm { min-height: 36px; padding: 0 14px; border-radius: var(--r); cursor: pointer; font-weight: 500; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; background: transparent; border: 1px solid var(--text); }
.carcard { overflow: hidden; display: flex; align-items: center; gap: 14px; }
.carcard .carinfo { min-width: 0; }
.car { flex: none; width: 104px; color: var(--text); }
.car svg { display: block; width: 100%; }
.sm.solid { background: var(--text); color: var(--bg); }
.ck { margin-top: 6px; }
.ck.bad { color: var(--bad); }
.sm:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.listhead { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 8px; }
.notice { display: block; width: 100%; text-align: left; cursor: pointer; padding: 16px 0; background: transparent; border: 0; border-top: 1px solid var(--border); }
.notice.unread { box-shadow: inset 2px 0 0 var(--accent); padding-left: 14px; }
.notice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.notice .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.notice .t { font-weight: 600; }
.notice .b { color: var(--muted); font-size: 14px; margin-top: 2px; white-space: pre-line; }
.fab {
  position: fixed; right: 20px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 20;
  min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--r); cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
}
.fab svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.fab:focus-visible, .bot-close:focus-visible, .bot-send:focus-visible, .chip-btn:focus-visible, .bot-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bot { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); padding-top: env(safe-area-inset-top); }
.bot-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.bot-head .t { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }
.bot-head .s { font-size: 12px; color: var(--muted); }
.bot-close { min-width: 44px; min-height: 44px; border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--muted); }
.bot-msgs { flex: 1; overflow-y: auto; padding: 20px; width: 100%; max-width: 560px; margin: 0 auto; }
.bubble { max-width: 88%; padding: 10px 14px; border-radius: var(--r); margin-bottom: 10px; white-space: pre-wrap; word-break: keep-all; }
.bubble.ai { background: var(--surface); border: 1px solid var(--border); }
.bubble.me { background: var(--text); color: var(--bg); margin-left: auto; }
.bubble.err { border-color: var(--bad); color: var(--bad); }
.bubble.wait { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.chip-btn { min-height: 38px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 14px; }
.bot-form { display: flex; gap: 8px; padding: 10px 20px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); width: 100%; max-width: 560px; margin: 0 auto; }
.bot-input { flex: 1; min-height: 48px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); font-size: 16px; }
.bot-send { min-width: 64px; min-height: 48px; border: 0; border-radius: var(--r); cursor: pointer; background: var(--text); color: var(--bg); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.bot-send:disabled { opacity: .5; cursor: default; }
.bot-note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 20px 6px; }
.chartwrap { margin-top: 4px; }
.readout { display: flex; align-items: baseline; gap: 10px; min-height: 40px; }
.readout .rv { font-size: 28px; font-weight: 300; letter-spacing: -.02em; }
.readout .rt { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.chart { display: block; user-select: none; -webkit-user-select: none; }
.swatches { display: flex; gap: 16px; margin: 6px 0 2px; font-size: 12px; color: var(--muted); }
.swatches i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; opacity: .6; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">AI-<span>V2G</span></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="ko" aria-pressed="true">KR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="iconbtn" id="themeBtn" type="button" data-i18n-aria="theme" aria-label="테마 전환"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
      <button class="iconbtn" id="meBtn" type="button" data-i18n="me_btn" hidden>내 정보</button>
      <button class="iconbtn" id="logoutBtn" type="button" data-i18n="logout" hidden>로그아웃</button>
    </div>
  </header>

  <div class="banner offline" id="offlineBanner" role="status" data-i18n="offline" hidden>오프라인입니다. 연결되면 최신 정보를 불러옵니다.</div>
  <div class="banner install" id="installBanner" hidden>
    <span id="installText" data-i18n="install_hint">홈 화면에 추가하면 앱처럼 쓸 수 있어요.</span>
    <button class="iconbtn" id="installBtn" type="button" data-i18n="add" hidden>추가</button>
  </div>

  <main id="view"></main>

  <nav class="tabs" id="tabs" role="tablist" aria-label="메뉴" data-i18n-aria="menu" hidden>
    <button class="tab" role="tab" data-tab="inbox" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg><span data-i18n="tab_inbox">알림</span><span class="badge" id="inboxBadge" hidden></span></button>
    <button class="tab" role="tab" data-tab="price" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></svg><span data-i18n="tab_price">충전 시간</span></button>
    <button class="tab" role="tab" data-tab="forecast" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18 9 11l4 4 8-9"/><path d="M15 6h6v6"/></svg><span data-i18n="tab_forecast">예측</span></button>
    <button class="tab" role="tab" data-tab="missions" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4"/><path d="M6 5h11l-2 4 2 4H6"/></svg><span data-i18n="tab_missions">미션</span></button>
  </nav>

  <button class="fab" id="botFab" type="button" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>EV Bot</button>
  <section class="bot" id="botPanel" role="dialog" aria-modal="true" aria-label="EV Bot" hidden>
    <div class="bot-head">
      <div><div class="t">EV Bot</div><div class="s" data-i18n="bot_sub">앱 사용법·용어·개인정보를 물어보세요</div></div>
      <button class="bot-close" id="botClose" type="button" data-i18n-aria="close" aria-label="닫기">✕</button>
    </div>
    <div class="bot-msgs" id="botMsgs" role="log" aria-live="polite"></div>
    <div class="bot-note" data-i18n="bot_note">금액·효과는 가정값이에요. 개인정보(번호판 등)는 입력하지 마세요.</div>
    <form class="bot-form" id="botForm">
      <input class="bot-input" id="botInput" type="text" maxlength="500" autocomplete="off" data-i18n-ph="bot_ph" placeholder="궁금한 점을 입력하세요" data-i18n-aria="bot_q" aria-label="질문 입력" />
      <button class="bot-send" id="botSend" type="submit" data-i18n="send">보내기</button>
    </form>
  </section>
</div>

<script>
(function () {
  'use strict';
  var view = document.getElementById('view');
  var tabs = document.getElementById('tabs');
  var logoutBtn = document.getElementById('logoutBtn');
  var meBtn = document.getElementById('meBtn');

  // ---------------------------------------------------------------- 언어팩 (기본 KR)
  var I18N = {

      ms_points: '시범 포인트', ms_month: '이번 달 {n}P / 상한 {cap}P', ms_note: '실제 금전 정산이 아닌 시범 포인트예요. 보상 수치는 협의 전 예시값이에요.',
      ms_consent_title: '포인트 적립', ms_consent_on: '적립 중이에요. 언제든 끌 수 있어요.', ms_consent_off: '켜면 달성한 미션의 포인트가 쌓여요.',
      ms_on: '켜기', ms_off: '끄기', ms_list: '미션', ms_done: '달성', ms_awarded: '+{n}P 적립', ms_pending: '동의하면 포인트가 쌓여요',
      ms_week: '이번 주', ms_once: '1회', ms_safe: '잔량을 낮추거나 무리한 방전을 유도하는 미션은 없어요.',
      ms_ver_unavailable: '충전 기록(OBD)이 연결된 차량에서 확인돼요.', ms_ver_pending: '충전 기록이 반영되면 확인돼요.',
      ms_intro_title: '미션이란?', ms_intro_lead: '충전 시간을 옮기고 앱을 활용하면 시범 포인트를 받는 활동이에요.',

    var id = 'g' + (++chartSeq);
    var defs = svgEl('defs');
    var grad = svgEl('linearGradient', { id: id, x1: 0, y1: 0, x2: 0, y2: 1 });
    [[0, 0.3], [1, 0]].forEach(function (st) {
      grad.appendChild(svgEl('stop', { offset: st[0], style: 'stop-color:var(--text);stop-opacity:' + st[1] }));
    });
    defs.appendChild(grad); svg.appendChild(defs);

    // 충전·방전 구간 배경띠
    var cw = (W - L - R) / Math.max(1, n - 1);
    var i = 0;
    while (i < n) {
      if (marks[i]) {
        var k = marks[i], j = i;
        while (j + 1 < n && marks[j + 1] === k) j++;
        svg.appendChild(svgEl('rect', {
          x: X(i) - cw / 2, y: T, width: (j - i + 1) * cw, height: H - T - B,
          fill: k === 'charge' ? 'var(--charge)' : 'var(--warn)', opacity: 0.18,
        }));
        i = j + 1;
      } else i++;
    }
    // 가로 눈금 4줄 + 축 값
    for (var g = 0; g <= 3; g++) {
      var gv = min + (max - min) * (g / 3), gy = Y(gv);
      svg.appendChild(svgEl('line', { x1: L, x2: W - R, y1: gy, y2: gy, stroke: 'var(--border)', 'stroke-width': 0.6 }));
      var gt = svgEl('text', { x: L - 5, y: gy + 3, 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 8 });
      gt.textContent = Math.round(gv);
      svg.appendChild(gt);
    }
    // 시간 눈금(약 6개)
    var every = Math.max(1, Math.round(n / 6));
    for (var xi = 0; xi < n; xi += every) {
      var xt = svgEl('text', { x: X(xi), y: H - 7, 'text-anchor': X(xi) > W - R - 14 ? 'end' : 'middle', fill: 'var(--muted)', 'font-size': 8 });
      xt.textContent = times ? hourLabel(times[xi]) + (lang === 'en' ? 'h' : '시') : String(xi);
      svg.appendChild(xt);
    }
    // 선·면적(가격은 계단형, 예측은 부드러운 곡선)
    var d = '';
    if (opts.step) {
      values.forEach(function (v, q) {
        var x0 = q === 0 ? X(0) : (X(q) + X(q - 1)) / 2, x1 = q === n - 1 ? X(n - 1) : (X(q) + X(q + 1)) / 2;
        d += (q === 0 ? 'M' : 'L') + x0 + ',' + Y(v) + 'L' + x1 + ',' + Y(v);
      });
    } else {
      values.forEach(function (v, q) {
        if (q === 0) { d = 'M' + X(0) + ',' + Y(v); return; }
        var cx = (X(q - 1) + X(q)) / 2;
        d += 'C' + cx + ',' + Y(values[q - 1]) + ',' + cx + ',' + Y(v) + ',' + X(q) + ',' + Y(v);
      });
    }
    var base = H - B;
    svg.appendChild(svgEl('path', { d: d + 'L' + X(n - 1) + ',' + base + 'L' + X(0) + ',' + base + 'Z', fill: 'url(#' + id + ')' }));
    svg.appendChild(svgEl('path', { d: d, fill: 'none', stroke: 'var(--text)', 'stroke-width': 1.4, 'stroke-linejoin': 'round' }));

    // 값 확인: 누르거나 움직이면 세로선과 점, 위 readout에 시각·값
    var cur = svgEl('line', { y1: T, y2: H - B, stroke: 'var(--accent)', 'stroke-width': 1, opacity: 0 });
    var dot = svgEl('circle', { r: 3.5, fill: 'var(--accent)', stroke: 'var(--bg)', 'stroke-width': 1.5, opacity: 0 });
    svg.appendChild(cur); svg.appendChild(dot);
    function show(q) {
      q = Math.max(0, Math.min(n - 1, q));
      cur.setAttribute('x1', X(q)); cur.setAttribute('x2', X(q)); cur.setAttribute('opacity', 1);
      dot.setAttribute('cx', X(q)); dot.setAttribute('cy', Y(values[q])); dot.setAttribute('opacity', 1);
      var tm = times ? fmtDay(times[q]) + ' ' + hourLabel(times[q]) + (lang === 'en' ? ':00' : '시') : '';
      clear(read);
      read.appendChild(el('span', { class: 'rv', text: (Math.round(values[q] * 10) / 10) + unit }));
      read.appendChild(el('span', { class: 'rt', text: tm }));
    }
    function at(ev) {
      var r = svg.getBoundingClientRect();
      var x = ((ev.clientX - r.left) / r.width) * W;
      show(Math.round(((x - L) / (W - L - R)) * (n - 1)));
    }
    svg.addEventListener('pointerdown', at);
    svg.addEventListener('pointermove', function (ev) { if (ev.pressure > 0 || ev.pointerType === 'mouse') at(ev); });
    svg.style.touchAction = 'pan-y';
    show(opts.focus != null ? opts.focus : values.indexOf(Math.max.apply(null, values)));
    return wrap;
  }

  }

  // ---------------------------------------------------------------- EV Bot
  // 앱 사용법·용어·개인정보를 안내한다. 서버(/owner/ask)가 이용자용 문서와 본인 차량 정보만 근거로 답한다.
  var botFab = document.getElementById('botFab');
  var botPanel = document.getElementById('botPanel');
  var botMsgs = document.getElementById('botMsgs');
  var botInput = document.getElementById('botInput');
  var botSend = document.getElementById('botSend');
  var botHistory = [];
  var botBusy = false;

  function tidy(text) {   // Gemini가 쓰는 마크다운 기호를 화면에 맞게 정리(텍스트로만 표시한다)
    return String(text).replace(/\*\*/g, '').replace(/^\s*[*-]\s+/gm, '• ').trim();
  }
  function addBubble(kind, text) {
    var b = el('div', { class: 'bubble ' + kind, text: text });
    botMsgs.appendChild(b);
    botMsgs.scrollTop = botMsgs.scrollHeight;
    return b;
  }
  function resetBot() {
    botHistory = [];
    clear(botMsgs);
    addBubble('ai', t('bot_hi'));
    var chips = el('div', { class: 'chips' });
    t('sug').forEach(function (q) {
      var c = el('button', { class: 'chip-btn', type: 'button', text: q });
      c.addEventListener('click', function () { sendBot(q); });
      chips.appendChild(c);
    });
    botMsgs.appendChild(chips);
  }
  function openBot() {
    if (!state.me) return;
    botPanel.hidden = false; botFab.hidden = true;
    if (!botMsgs.firstChild) resetBot();
    botInput.focus();
  }
  function closeBot(wipe) {
    var wasOpen = !botPanel.hidden;
    botPanel.hidden = true;
    botFab.hidden = !state.me;
    if (wipe) { botHistory = []; clear(botMsgs); }
    if (wasOpen && state.me) botFab.focus();
  }
  async function sendBot(text) {
    text = (text || '').trim();
    if (!text || botBusy) return;
    botBusy = true; botSend.disabled = true;
    addBubble('me', text);
    botInput.value = '';
    var wait = addBubble('ai wait', t('bot_wait'));
    try {
      var r = await api('/owner/ask', { method: 'POST', body: JSON.stringify({ question: text, history: botHistory.slice(-4), lang: lang }) });
      wait.remove();
      if (r.ok && r.body && r.body.answer) {
        var answer = tidy(r.body.answer);
        addBubble('ai', answer);
        botHistory.push({ role: 'user', text: text.slice(0, 500) }, { role: 'ai', text: answer.slice(0, 500) });
        botHistory = botHistory.slice(-4);
      } else if (r.status === 401 || r.status === 403) {
        closeBot(true);
        renderLogin({ key: 'login_needed' });
      } else {
        var detail = r.body && typeof r.body.detail === 'string' ? r.body.detail : t('bot_fail');
        addBubble('ai err', detail);
      }
    } catch (e) {
      wait.remove();
      addBubble('ai err', t('bot_net'));
    } finally {
      botBusy = false; botSend.disabled = false;
      if (!botPanel.hidden) botInput.focus();
    }
  }
  botFab.addEventListener('click', openBot);
  document.getElementById('botClose').addEventListener('click', function () { closeBot(false); });
  document.getElementById('botForm').addEventListener('submit', function (ev) { ev.preventDefault(); sendBot(botInput.value); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !botPanel.hidden) closeBot(false); });

  // ---------------------------------------------------------------- 알림 새로고침
  // 앱을 다시 열거나 화면이 보일 때, 그리고 보이는 동안 1분마다 안 읽은 알림 수를 확인한다.
  async function pollUnread() {
    if (!state.me || document.visibilityState !== 'visible' || !navigator.onLine) return;
    var r;
    try { r = await api('/owner/notifications?limit=1'); } catch (e) { return; }
    if (!r || !r.ok) return;
    if (r.body.unread !== state.unread) {
      if (state.tab === 'inbox') renderHome(); else setUnread(r.body.unread);
    }
  }
  document.addEventListener('visibilitychange', pollUnread);
  setInterval(pollUnread, 60000);

  applyStatic();
  boot();
})();
</script>
</body>
</html>
