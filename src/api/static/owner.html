  var lang = (document.documentElement.getAttribute('lang') === 'en') ? 'en' : 'ko';
  function t(key, vars) {
    var s = (I18N[lang] && I18N[lang][key] != null) ? I18N[lang][key] : (I18N.ko[key] != null ? I18N.ko[key] : key);
    if (vars && typeof s === 'string') Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }
  function applyStatic() {
    document.documentElement.setAttribute('lang', lang);
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (n) { n.setAttribute('aria-label', t(n.getAttribute('data-i18n-aria'))); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-ph]'), function (n) { n.setAttribute('placeholder', t(n.getAttribute('data-i18n-ph'))); });
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    if (isIos && !standalone && !dismissed) document.getElementById('installText').textContent = t('install_ios');
  }
  function setLang(next) {
    if (next === lang) return;
    lang = next;
    try { localStorage.setItem('ai-v2g-lang', lang); } catch (e) { /* 저장 불가여도 이번 화면에는 적용 */ }
    applyStatic();
    if (state.me) renderHome();
    else renderLogin(state.loginMsg);
  }
  document.querySelector('.seg').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-lang]');
    if (b) setLang(b.getAttribute('data-lang'));
  });

  function el(tag, props, children) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  }

  // ---------------------------------------------------------------- 화면: 로그인
  // message: { key } 번역 키 또는 { raw } 서버 메시지
  function renderLogin(message) {
    state.me = null; state.loginMsg = message || null;
    tabs.hidden = true; logoutBtn.hidden = true; meBtn.hidden = true;
    clear(view);
    function msgText(m) { return !m ? '' : (m.raw != null ? m.raw : t(m.key)); }
    var err = el('div', { class: 'error', role: 'alert', text: msgText(message) });
    var user = el('input', { type: 'text', id: 'u', autocomplete: 'username', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', required: '' });
    var pass = el('input', { type: 'password', id: 'p', autocomplete: 'current-password', required: '' });
    var btn = el('button', { class: 'primary', type: 'submit', text: t('login') });
    var form = el('form', { novalidate: '' }, [
      el('label', { for: 'u', text: t('username') }), user,
      el('label', { for: 'p', text: t('password') }), pass,
      err, btn,
    ]);
    form.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      err.textContent = '';
      if (!user.value || !pass.value) { err.textContent = t('need_both'); return; }
      btn.disabled = true; btn.textContent = t('logging_in');
      try {
        var r = await api('/auth/login', { method: 'POST', body: JSON.stringify({ username: user.value.trim(), password: pass.value }) });
        if (!r.ok) { err.textContent = (r.body && typeof r.body.detail === 'string' && r.body.detail) || t('login_fail'); return; }
        pass.value = '';

      } catch (e) {
        err.textContent = t('net_err');
      } finally {
        btn.disabled = false; btn.textContent = t('login');
      }
    });
    var card = el('div', { class: 'card' }, [
      el('div', { class: 'big', text: t('login_title') }),
      el('p', { class: 'muted', text: t('login_desc') }),
      form,
    ]);
    var su = el('button', { class: 'linkbtn', type: 'button', text: t('signup') });
    su.addEventListener('click', function () { renderSignup(); });
    card.appendChild(su);
    view.appendChild(card);
    addDevLogin(card, err);
  }

  // 운행 정보(선택) — 빈 칸은 보내지 않는다(서버 기본값을 쓴다)

  // ---------------------------------------------------------------- 화면: 내 정보 (열람·정정·비밀번호·동의·이력·탈퇴·재신청)
  var PURPOSE_KEY = { v2g_discharge: 'mp_c_v2g', collect: 'mp_c_collect', profile: 'mp_c_profile', share_external: 'mp_c_share', research: 'mp_c_research' };
  function kv(label, value) { return el('div', { class: 'kv' }, [el('span', { text: label }), el('span', { text: value == null || value === '' ? '-' : String(value) })]); }
  function selectOf(items, valueOf, labelOf, current) {
    var sel = el('select', {}, [el('option', { value: '', text: t('su_pick') })]);
    items.forEach(function (it) { sel.appendChild(el('option', { value: valueOf(it), text: labelOf(it) })); });
    sel.value = current || '';
    return sel;
  }
  // 시·도를 고르면 그 시·도의 시·군·구만 선택지로 채운다(가입 화면과 같은 목록)
  function provinceSelects(opt, sidoVal, sigunguVal) {
    var byProv = opt.sigungu_by_sido || {};
    var sido = selectOf(opt.sido, function (x) { return x; }, function (x) { return x; }, sidoVal);
    var sg = el('select', {});
    function fill(selected) {
      clear(sg);
      var names = byProv[sido.value] || [];
      sg.appendChild(el('option', { value: '', text: names.length ? t('su_pick') : t('su_sigungu_first') }));
      names.forEach(function (n) { sg.appendChild(el('option', { value: n, text: n })); });
      sg.disabled = !names.length;
      sg.value = selected || '';
    }
    sido.addEventListener('change', function () { fill(''); });
    fill(sigunguVal);
    return { sido: sido, sigungu: sg };
  }
  function errText(r, fallback) {
    var d = r && r.body && r.body.detail;
    return (typeof d === 'string' && d) || (Array.isArray(d) && d[0] && d[0].msg) || fallback;
  }
  async function renderMyPage() {
    tabs.hidden = true;
    clear(view);
    view.appendChild(el('div', { class: 'empty', role: 'status', text: t('loading') }));
    var rs;
    try { rs = await Promise.all([api('/owner/my-data'), api('/owner/history'), api('/signup/options')]); } catch (e) { rs = null; }
    clear(view);
    var back = el('button', { class: 'sm', type: 'button', text: t('mp_back') });
    back.addEventListener('click', function () { boot(); });
    view.appendChild(el('div', { class: 'listhead' }, [el('span', { class: 'eyebrow', text: t('mp_title') }), back]));
    if (!rs || !rs[0].ok) { view.appendChild(emptyTab('warn', t('mp_fail'), t('mp_fail_sub'))); return; }
    var d = rs[0].body, hist = rs[1].ok ? (rs[1].body.history || []) : [], opt = rs[2].ok ? rs[2].body : null;
    var reg = d.registration;

    // 1) 계정·차량 정보
    var info = el('div', { class: 'card' }, [el('h2', { text: t('mp_account') }),

      if (plate) kids.push(el('label', { text: t('su_plate') }), plate);
      kids.push(el('label', { text: t('su_occ') }), occ, el('label', { text: t('su_sido') }), prov.sido, el('label', { text: t('su_sigungu') }), prov.sigungu);
      var opDep = el('input', { type: 'time', value: reg.departure_time || '' });
      var opTarget = el('input', { type: 'number', min: '20', max: '100', inputmode: 'numeric', value: reg.target_soc_pct == null ? '' : String(reg.target_soc_pct) });
      var opMin = el('input', { type: 'number', min: '10', max: '90', inputmode: 'numeric', value: reg.min_soc_pct == null ? '' : String(reg.min_soc_pct) });

  var SVG_NS = 'http://www.w3.org/2000/svg';

  function rangeLabel(p) {

  // 시간별 추세 그래프 — 면적+선, 가로 눈금, 시간 눈금, 충전/방전 구간 배경띠, 터치·마우스로 값 확인.
  // 구간은 배경색뿐 아니라 아래 범례 글로도 안내한다(색만으로 구분하지 않도록).
  var chartSeq = 0;
  function barChart(values, marks, label, unit, times, opts) {
    opts = opts || {};
    var W = 320, H = 168, L = 30, R = 8, T = 10, B = 22, n = values.length;
    var wrap = el('div', { class: 'chartwrap' });
    var read = el('div', { class: 'readout', 'aria-live': 'polite' });
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', role: 'img', 'aria-label': label, class: 'chart' });
    wrap.appendChild(read); wrap.appendChild(svg);
    var max = Math.max.apply(null, values.concat([1])), min = 0;
    max = max * 1.08;
    function X(i) { return n < 2 ? L : L + (i / (n - 1)) * (W - L - R); }
    function Y(v) { return T + (1 - (v - min) / (max - min)) * (H - T - B); }
    var id = 'g' + (++chartSeq);
    var defs = svgEl('defs');
    var grad = svgEl('linearGradient', { id: id, x1: 0, y1: 0, x2: 0, y2: 1 });
    [[0, 0.3], [1, 0]].forEach(function (st) {
      grad.appendChild(svgEl('stop', { offset: st[0], style: 'stop-color:var(--text);stop-opacity:' + st[1] }));
    });
    defs.appendChild(grad); svg.appendChild(defs);

    // 충전·방전 구간 배경띠
    var cw = (W - L - R) / Math.max(1, n - 1);
    var i = 0;
    while (i < n) {
      if (marks[i]) {
        var k = marks[i], j = i;
        while (j + 1 < n && marks[j + 1] === k) j++;
        svg.appendChild(svgEl('rect', {
          x: X(i) - cw / 2, y: T, width: (j - i + 1) * cw, height: H - T - B,
          fill: k === 'charge' ? 'var(--charge)' : 'var(--warn)', opacity: 0.18,
        }));
        i = j + 1;
      } else i++;
    }
    // 가로 눈금 4줄 + 축 값
    for (var g = 0; g <= 3; g++) {
      var gv = min + (max - min) * (g / 3), gy = Y(gv);
      svg.appendChild(svgEl('line', { x1: L, x2: W - R, y1: gy, y2: gy, stroke: 'var(--border)', 'stroke-width': 0.6 }));
      var gt = svgEl('text', { x: L - 5, y: gy + 3, 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 8 });
      gt.textContent = Math.round(gv);
      svg.appendChild(gt);
    }
    // 시간 눈금(약 6개)
    var every = Math.max(1, Math.round(n / 6));
    for (var xi = 0; xi < n; xi += every) {
      var xt = svgEl('text', { x: X(xi), y: H - 7, 'text-anchor': X(xi) > W - R - 14 ? 'end' : 'middle', fill: 'var(--muted)', 'font-size': 8 });
      xt.textContent = times ? hourLabel(times[xi]) + (lang === 'en' ? 'h' : '시') : String(xi);
      svg.appendChild(xt);
    }
    // 선·면적(가격은 계단형, 예측은 부드러운 곡선)
    var d = '';
    if (opts.step) {
      values.forEach(function (v, q) {
        var x0 = q === 0 ? X(0) : (X(q) + X(q - 1)) / 2, x1 = q === n - 1 ? X(n - 1) : (X(q) + X(q + 1)) / 2;
        d += (q === 0 ? 'M' : 'L') + x0 + ',' + Y(v) + 'L' + x1 + ',' + Y(v);
      });
    } else {
      values.forEach(function (v, q) {
        if (q === 0) { d = 'M' + X(0) + ',' + Y(v); return; }
        var cx = (X(q - 1) + X(q)) / 2;
        d += 'C' + cx + ',' + Y(values[q - 1]) + ',' + cx + ',' + Y(v) + ',' + X(q) + ',' + Y(v);
      });
    }
    var base = H - B;
    svg.appendChild(svgEl('path', { d: d + 'L' + X(n - 1) + ',' + base + 'L' + X(0) + ',' + base + 'Z', fill: 'url(#' + id + ')' }));
    svg.appendChild(svgEl('path', { d: d, fill: 'none', stroke: 'var(--text)', 'stroke-width': 1.4, 'stroke-linejoin': 'round' }));

    // 값 확인: 누르거나 움직이면 세로선과 점, 위 readout에 시각·값
    var cur = svgEl('line', { y1: T, y2: H - B, stroke: 'var(--accent)', 'stroke-width': 1, opacity: 0 });
    var dot = svgEl('circle', { r: 3.5, fill: 'var(--accent)', stroke: 'var(--bg)', 'stroke-width': 1.5, opacity: 0 });
    svg.appendChild(cur); svg.appendChild(dot);
    function show(q) {
      q = Math.max(0, Math.min(n - 1, q));
      cur.setAttribute('x1', X(q)); cur.setAttribute('x2', X(q)); cur.setAttribute('opacity', 1);
      dot.setAttribute('cx', X(q)); dot.setAttribute('cy', Y(values[q])); dot.setAttribute('opacity', 1);
      var tm = times ? fmtDay(times[q]) + ' ' + hourLabel(times[q]) + (lang === 'en' ? ':00' : '시') : '';
      clear(read);
      read.appendChild(el('span', { class: 'rv', text: (Math.round(values[q] * 10) / 10) + unit }));
      read.appendChild(el('span', { class: 'rt', text: tm }));
    }
    function at(ev) {
      var r = svg.getBoundingClientRect();
      var x = ((ev.clientX - r.left) / r.width) * W;
      show(Math.round(((x - L) / (W - L - R)) * (n - 1)));
    }
    svg.addEventListener('pointerdown', at);
    svg.addEventListener('pointermove', function (ev) { if (ev.pressure > 0 || ev.pointerType === 'mouse') at(ev); });
    svg.style.touchAction = 'pan-y';
    show(opts.focus != null ? opts.focus : values.indexOf(Math.max.apply(null, values)));
    return wrap;
  }

    if (!r.ok) { box.appendChild(emptyTab('trend', t('rp_wait'), (r.body && r.body.detail) || '')); return; }
    var b = r.body;
    if (b.has_data) {
      var m = b.metrics, c = b.compare || {}, d = b.driving || {};
      function peer(k, unit) { return c[k] && c[k].median != null ? c[k].median + unit : null; }
      box.appendChild(el('div', { class: 'card' }, [
        el('h2', { text: t('rp_title') }),
        el('p', { class: 'muted', text: t('rp_period') + ' ' + b.window.from + ' ~ ' + b.window.to }),
        el('div', { class: 'g2' }, [
          metricBox(t('rp_m_week'), m.per_week == null ? null : m.per_week + t('rp_unit_times'), peer('per_week', t('rp_unit_times'))),
          metricBox(t('rp_m_avg'), m.avg_kwh == null ? null : m.avg_kwh + ' kWh', peer('avg_kwh', ' kWh')),
          metricBox(t('rp_m_kwhw'), m.kwh_per_week == null ? null : m.kwh_per_week + ' kWh', null),
          metricBox(t('rp_m_peak'), m.peak_share_pct == null ? null : m.peak_share_pct + '%', peer('peak_share_pct', '%')),
          metricBox(t('rp_m_won'), m.won_per_kwh == null ? null : m.won_per_kwh + (lang === 'en' ? ' KRW' : '원'), peer('won_per_kwh', lang === 'en' ? ' KRW' : '원')),
          metricBox(t('rp_m_kmw'), d.km_per_week == null ? null : d.km_per_week + ' km', null),
          metricBox(t('rp_m_kmkwh'), d.km_per_kwh == null ? null : d.km_per_kwh + ' km', null),
          metricBox(t('rp_m_wonkm'), d.won_per_km == null ? null : d.won_per_km + (lang === 'en' ? ' KRW' : '원'), null),
        ]),
      ]));
      var ai = el('div', { class: 'card' }, [el('h2', { text: t('rp_ai'), 'data-kind': 'inferred' })]);
      (b.insights || []).forEach(function (it) {
        ai.appendChild(el('div', { class: 'ins' }, [el('b', { text: it.title }), el('p', { text: it.text })]));
      });
      box.appendChild(ai);
    } else {
      box.appendChild(emptyTab('trend', t('rp_wait'), b.message || ''));
    }
    var input = el('input', { type: 'number', min: '0', step: '1', inputmode: 'numeric', 'aria-label': t('rp_odo') });
    var msg = el('div', { class: 'okmsg', role: 'status' });
    var btn = el('button', { class: 'primary', type: 'button', text: t('rp_odo_btn') });
    var odoCard = el('div', { class: 'card' }, [el('h2', { text: t('rp_odo') }), el('p', { class: 'muted', text: t('rp_odo_hint') }), input, btn, msg]);
    var recent = (b.odometer || []).slice().reverse();
    odoCard.appendChild(el('p', { class: 'muted gap', text: t('rp_recent') }));
    if (!recent.length) odoCard.appendChild(el('div', { class: 'muted', text: t('rp_none') }));
    recent.forEach(function (o) { odoCard.appendChild(kv(String(o.recorded_at).slice(0, 10), Number(o.odometer_km).toLocaleString(t('locale')) + ' km')); });
    btn.addEventListener('click', async function () {
      msg.className = 'okmsg'; msg.textContent = '';
      if (input.value === '') return;
      btn.disabled = true;
      var res = await api('/owner/odometer', { method: 'POST', body: JSON.stringify({ odometer_km: Number(input.value) }) });
      btn.disabled = false;
      if (res.ok) { msg.textContent = t('rp_odo_done'); renderHome(); }
      else { msg.className = 'error'; msg.textContent = (res.body && typeof res.body.detail === 'string') ? res.body.detail : String(res.status); }
    });
    box.appendChild(odoCard);
    if (b.note) box.appendChild(el('p', { class: 'muted', text: b.note }));
  }
  // 내 차량 일러스트 — 면 색으로 그린 전기차 옆모습(고정 SVG라 사용자 입력이 들어가지 않는다). 색은 테마 변수를 따른다.
  function carIllustration() {
    var wrap = el('div', { class: 'car', 'aria-hidden': 'true' });
    wrap.innerHTML =
      '<svg viewBox="0 0 160 76" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
      '<ellipse cx="80" cy="68" rx="70" ry="3.5" fill="var(--surface-2)"/>' +
      '<path d="M8 52c0-7 4-11 11-13l16-5c8-10 19-16 36-16h14c14 0 25 7 33 17l17 5c6 2 9 6 9 12v5c0 3-2 5-5 5H13c-3 0-5-2-5-5z" fill="var(--accent)"/>' +
      '<path d="M44 34c7-8 15-12 29-12h16c10 0 19 6 26 14H44z" fill="var(--surface)" fill-opacity=".92"/>' +
      '<path d="M82 22v14" stroke="var(--accent)" stroke-width="2.4"/>' +
      '<path d="M138 41h14c2 0 3 1 3 3v3h-17z" fill="var(--surface)" fill-opacity=".85"/>' +
      '<rect x="8" y="42" width="5" height="4" rx="1.6" fill="var(--warn)"/>' +
      '<path d="M66 44l-5 8h5l-3 7 8-10h-5l3-5z" fill="var(--surface)" fill-opacity=".9"/>' +
      '<circle cx="40" cy="58" r="12.5" fill="var(--surface)"/><circle cx="40" cy="58" r="10" fill="var(--text)"/><circle cx="40" cy="58" r="4.2" fill="var(--surface-2)"/>' +
      '<circle cx="122" cy="58" r="12.5" fill="var(--surface)"/><circle cx="122" cy="58" r="10" fill="var(--text)"/><circle cx="122" cy="58" r="4.2" fill="var(--surface-2)"/>' +
      '</svg>';
    return wrap;
  }
  function renderHome() {
    clear(view);
    view.appendChild(el('div', { class: 'card carcard hero' }, [
      carIllustration(),
      el('div', { class: 'carinfo' }, [
        el('h2', { text: t('my_car') }),
        el('div', { class: 'big', text: state.me.ev_id }),
        el('div', { class: 'muted', text: state.me.username + t('user_suffix') }),
      ]),
    ]));
    var box = el('div', {});
    view.appendChild(box);
    TAB_VIEWS[state.tab](box);
    tabs.hidden = false; logoutBtn.hidden = false; meBtn.hidden = false;
    Array.prototype.forEach.call(tabs.querySelectorAll('.tab'), function (tb) {
      tb.setAttribute('aria-selected', String(tb.getAttribute('data-tab') === state.tab));
    });
  }
  tabs.addEventListener('click', function (ev) {
    var tb = ev.target.closest('.tab');
    if (!tb || !state.me) return;
    state.tab = tb.getAttribute('data-tab');
    renderHome();
  });

  // ---------------------------------------------------------------- 시작·세션
  // 관리자가 바꾼 앱 문구 적용 — 기본 문구를 처음 한 번 저장해 두었다가, 바뀐 값만 덮고 지워지면 기본으로 되돌린다.
  var I18N_BASE = {};
  async function applyContentOverrides() {
    var r;
    try { r = await api('/owner/app-content'); } catch (e) { return; }
    if (!r || !r.ok) return;
    var ov = r.body.overrides || {};
    ['ko', 'en'].forEach(function (l) {
      Object.keys(I18N_BASE).forEach(function (k) { if (I18N_BASE[k][l] != null) I18N[l][k] = I18N_BASE[k][l]; });
      Object.keys(ov).forEach(function (k) {
        if (!I18N_BASE[k]) I18N_BASE[k] = {};
        if (I18N_BASE[k][l] == null) I18N_BASE[k][l] = I18N[l][k];
        if (ov[k][l]) I18N[l][k] = ov[k][l];
      });
    });
  }
  async function boot(refreshed) {
    var r;
    try { r = await api('/owner/me'); } catch (e) { r = null; }
    if (r && r.ok) { state.me = r.body; await applyContentOverrides(); renderHome(); return; }
    if (r && r.status === 403) {
      // 가입했지만 아직 차량이 연결되지 않은 계정이면 승인 대기 화면을 보여 준다
      var rg = null;
      try { rg = await api('/owner/registration'); } catch (e) { rg = null; }
      if (rg && rg.ok && rg.body && !rg.body.linked) { renderPending(rg.body.registration, refreshed ? t('pend_still') : ''); return; }
      // 로그인은 됐지만 차량 등록자 계정이 아님(관리자 등) — 이 화면에서는 쓸 수 없다.
      // 세션은 건드리지 않는다(같은 브라우저의 관리자 대시보드 로그인이 끊기지 않게). 새로 로그인하면 덮어쓰인다.
      renderLogin({ key: 'not_owner' });
      return;
    }
    renderLogin(r ? null : { key: 'net_err' });
  }
  logoutBtn.addEventListener('click', async function () {
    try { await api('/auth/logout', { method: 'POST' }); } catch (e) { /* 오프라인이어도 화면은 로그아웃 상태로 */ }
    renderLogin(null);
  });

  // ---------------------------------------------------------------- 테마
  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ai-v2g-theme', next); } catch (e) { /* 저장 불가여도 이번 화면에는 적용 */ }
  });

  // ---------------------------------------------------------------- 오프라인 표시
  var offlineBanner = document.getElementById('offlineBanner');
  function syncOnline() { offlineBanner.hidden = navigator.onLine; }
  window.addEventListener('online', syncOnline);
  window.addEventListener('offline', syncOnline);
  syncOnline();

  // ---------------------------------------------------------------- 홈 화면 추가 안내
  var installBanner = document.getElementById('installBanner');
  var installBtn = document.getElementById('installBtn');
  var installText = document.getElementById('installText');
  var deferredPrompt = null;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var dismissed = false;
  try { dismissed = localStorage.getItem('ai-v2g-install-dismissed') === '1'; } catch (e) { dismissed = false; }

  window.addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault();
    deferredPrompt = ev;
    if (standalone || dismissed) return;
    installBtn.hidden = false; installBanner.hidden = false;
  });
  installBtn.addEventListener('click', async function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (e) { /* 무시 */ }
    deferredPrompt = null;
    installBanner.hidden = true;
    try { localStorage.setItem('ai-v2g-install-dismissed', '1'); } catch (e) { /* 무시 */ }
  });
  // iOS Safari는 설치 프롬프트 이벤트가 없어 안내 문구만 보여준다
  var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIos && !standalone && !dismissed) {
    installText.textContent = t('install_ios');
    installBanner.hidden = false;
  }

  // ---------------------------------------------------------------- 서비스 워커
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () { /* 미지원·차단 시 일반 웹으로 동작 */ });
    });
  }


  applyStatic();
  boot();
})();
</script>
</body>
</html>
